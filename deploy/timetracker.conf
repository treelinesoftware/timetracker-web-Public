# Time Tracker dashboard: http://<server>/timetracker/
# Everything requires a login except the ingest endpoint, which checks its own token.
<Directory "/var/www/html/timetracker">
    AllowOverride None
    Options -Indexes
    AuthType Basic
    AuthName "Time Tracker"
    AuthBasicProvider file
    AuthUserFile /etc/httpd/timetracker.htpasswd
    Require valid-user

    <Files "config.php">
        Require all denied
    </Files>
    <FilesMatch "\.sql$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/timetracker/includes">
    Require all denied
</Directory>

# Command-line scripts (weekly email) are never served over the web
<Directory "/var/www/html/timetracker/cli">
    Require all denied
</Directory>

<Location "/timetracker/api/ingest.php">
    Require all granted
</Location>

# Installers and tracker programs for other computers (no secrets; the token is passed on the command line)
<Location "/timetracker/downloads/">
    Require all granted
</Location>
